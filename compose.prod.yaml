services:
  api:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/game-panel-lite-api:${GAMEPANEL_IMAGE_TAG:-v0.2.12}
    pull_policy: always
    restart: unless-stopped
    environment:
      GAMEPANEL_HOST: 0.0.0.0
      GAMEPANEL_PORT: 4000
      GAMEPANEL_DATA_DIR: ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}/data
      GAMEPANEL_DB_PATH: ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}/data/gamepanel.db
      GAMEPANEL_DOCKER_HOST: unix:///var/run/docker.sock
      GAMEPANEL_PROVIDER_CATALOG_PATH: ${GAMEPANEL_PROVIDER_CATALOG_PATH:-/etc/gamepanel/providers.json}
      GAMEPANEL_IMAGE_REGION: ${GAMEPANEL_IMAGE_REGION:-global}
      GAMEPANEL_IMAGE_REGISTRY: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}
      GAMEPANEL_IMAGE_TAG: ${GAMEPANEL_IMAGE_TAG:-v0.2.12}
      GAMEPANEL_PROMETHEUS_URL: ${GAMEPANEL_PROMETHEUS_URL:-http://127.0.0.1:9090}
      GAMEPANEL_PROMETHEUS_QUERY_TIMEOUT: 2s
      GAMEPANEL_RELEASE_MANIFEST_URL: ${GAMEPANEL_RELEASE_MANIFEST_URL:-https://github.com/smartcat999/game-panel-lite/releases/latest/download/manifest.json}
      GAMEPANEL_SYSTEM_UPDATE_INTERVAL: ${GAMEPANEL_SYSTEM_UPDATE_INTERVAL:-24h}
      GAMEPANEL_UPDATER_URL: ${GAMEPANEL_UPDATER_URL:-http://127.0.0.1:4020}
      GAMEPANEL_UPDATER_TOKEN: ${GAMEPANEL_UPDATER_TOKEN:?GAMEPANEL_UPDATER_TOKEN is required}
    network_mode: host
    stop_grace_period: 20s
    volumes:
      - ./config/providers.json:/etc/gamepanel/providers.json:ro
      - ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}:${GAMEPANEL_WORKSPACE_PATH:-${PWD}}
      - ${GAMEPANEL_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock

  updater:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/game-panel-lite-updater:${GAMEPANEL_IMAGE_TAG:-v0.2.12}
    pull_policy: always
    restart: unless-stopped
    environment:
      GAMEPANEL_UPDATER_HOST: 0.0.0.0
      GAMEPANEL_UPDATER_PORT: 4020
      GAMEPANEL_UPDATER_WORKSPACE: ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}
      GAMEPANEL_UPDATER_TOKEN: ${GAMEPANEL_UPDATER_TOKEN:?GAMEPANEL_UPDATER_TOKEN is required}
    ports:
      - "127.0.0.1:4020:4020"
    volumes:
      - ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}:${GAMEPANEL_WORKSPACE_PATH:-${PWD}}
      - ${GAMEPANEL_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock

  gamepanel-exporter:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/game-panel-lite-exporter:${GAMEPANEL_IMAGE_TAG:-v0.2.12}
    pull_policy: always
    restart: unless-stopped
    environment:
      GAMEPANEL_HOST: 0.0.0.0
      GAMEPANEL_PORT: 4010
      GAMEPANEL_DATA_DIR: ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}/data
      GAMEPANEL_DB_PATH: ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}/data/gamepanel.db
    depends_on:
      - api
    expose:
      - "4010"
    volumes:
      - ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}:${GAMEPANEL_WORKSPACE_PATH:-${PWD}}

  palworld-mod-pack:
    profiles:
      - jobs
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/game-panel-lite-palworld-mod-pack:${GAMEPANEL_PALWORLD_MOD_PACK_TAG:-v0.1.0}
    pull_policy: always
    environment:
      GAMEPANEL_DATA_DIR: ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}/data
      GAMEPANEL_PALWORLD_MOD_SOURCE_DIR: /palworld-mod-pack
    volumes:
      - ${GAMEPANEL_WORKSPACE_PATH:-${PWD}}:${GAMEPANEL_WORKSPACE_PATH:-${PWD}}

  prometheus:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/prometheus:${GAMEPANEL_PROMETHEUS_TAG:-v2.55.1}
    pull_policy: missing
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${GAMEPANEL_PROMETHEUS_DATA_DIR:-./data/prometheus}:/prometheus
    depends_on:
      - api
      - gamepanel-exporter
      - cadvisor
      - node-exporter
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cadvisor:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/cadvisor:${GAMEPANEL_CADVISOR_TAG:-v0.52.1}
    pull_policy: missing
    restart: unless-stopped
    privileged: true
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - ${GAMEPANEL_DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro

  node-exporter:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/node-exporter:${GAMEPANEL_NODE_EXPORTER_TAG:-v1.10.2}
    pull_policy: missing
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  web:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/game-panel-lite-web:${GAMEPANEL_IMAGE_TAG:-v0.2.12}
    pull_policy: always
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      - api
    expose:
      - "3000"

  nginx:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/nginx:${GAMEPANEL_NGINX_TAG:-1.27-alpine}
    pull_policy: missing
    depends_on:
      - api
      - web
    ports:
      - "${GAMEPANEL_WEB_PORT:-3001}:80"
    volumes:
      - ./deploy/nginx/gamepanel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/www:/var/www/certbot:ro
