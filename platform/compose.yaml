name: gamepanel-platform

services:
  global-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamepanel_global
      POSTGRES_USER: gamepanel
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamepanel -d gamepanel_global"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - global-postgres-data:/var/lib/postgresql/data

  region-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gamepanel_region
      POSTGRES_USER: gamepanel
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamepanel -d gamepanel_region"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - region-postgres-data:/var/lib/postgresql/data

  broker:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - broker-data:/data

volumes:
  global-postgres-data:
  region-postgres-data:
  broker-data:
