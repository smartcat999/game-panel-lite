tagline: 开放世界生存制作 · 32 人专用联机服
versions:
- latest
consoleDelivery: palworld-send-to-console
consoleActions:
- id: pal-save
  title: 立即保存世界存档
  group: 存档广播
  command: Save
  starred: true
- id: pal-broadcast
