  regeneratePaths:
  - Pal/Saved/SaveGames
metrics:
- id: online_players
  label: 在线玩家
  unit: 人
  source: exec
  mode: regex_count
  probeCommand: >-
    python3 -c 'import base64,json,os,re,subprocess,urllib.request;pw="paladmin123";f="/data/rcon.yaml";m=re.search(r"password:\s*\"?([^\"\r\n]+)\"?",open(f).read()) if os.path.exists(f) else None;pw=m.group(1) if m else pw;req=urllib.request.Request("http://127.0.0.1:8212/v1/api/players",headers={"Authorization":"Basic "+base64.b64encode(("admin:"+pw).encode()).decode()});print("name,playeruid,steamid");exec("try:\n d=json.loads(urllib.request.urlopen(req,timeout=1.5).read().decode(\"utf-8\",\"replace\"))\n for p in d.get(\"players\",[]):\n  n=str(p.get(\"name\") or p.get(\"accountName\") or \"\").strip()\n  u=str(p.get(\"userId\") or p.get(\"playerId\") or \"\").strip()\n  if u.startswith(\"steam_\"): u=u[6:]\n  if n and u: print(f\"{n} ({u})\")\nexcept Exception:\n out=subprocess.run([\"rcon-cli\",\"ShowPlayers\"],capture_output=True,text=True,timeout=1.5).stdout\n for ln in out.splitlines()[1:]:\n  c=[x.strip() for x in ln.replace(\"\\r\",\"\").split(\",\")]\n  if len(c)>=3 and c[0] and c[2]: print(f\"{c[0]} ({c[2]})\")")' 2>/dev/null
  pattern: '^(.+\s+\([0-9A-Za-z_:-]+\))$'
  itemPattern: '^(.+\s+\([0-9A-Za-z_:-]+\))$'
  maxConfigKey: maxPlayers
  bindParam: steamid
  quickActionIds:
  - pal-kick
