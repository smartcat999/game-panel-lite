configSchema:
- name: adminPassword
  label: 初始管理员密码
  type: password
  default: pzadmin123
  group: 基础设置
  help: 首次创建服务器时初始化 admin 账号的密码；留空由系统自动生成
  envKey: ADMIN_PASSWORD
  fileTarget: Zomboid/Server/servertest.ini
- name: server.PublicName
  label: 服务器公开名称
  default: My PZ Server
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 在游戏内浏览器和Steam浏览器 (如果适用) 中显示的服务器名称
  type: text
- name: server.PublicDescription
  label: 服务器简介描述
  default: ''
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 游戏内公共服务器浏览器中显示的描述. 输入   将在你的描述中创建一个新行
  type: text
- name: server.MaxPlayers
  label: 最大玩家人数
  default: '32'
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: '设置服务器的人数上限, 不含管理员. 警告: 服务器超过 32 人将可能导致地图传输问题和同步问题, 请谨慎操作. 最小值=1 最大值=254 默认=32'
  type: number
  min: 1.0
  max: 254.0
  step: 1
  envKey: MAX_PLAYERS
- name: server.Password
  label: 服务器进服密码
  default: ''
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 玩家必须知道密码才能加入服务器. (通过主机按钮托管服务器时忽略)
  type: password
  envKey: SERVER_PASSWORD
- name: server.Map
  label: 加载地图列表 (; 分隔)
  default: Muldraugh, KY
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 基础地图名称（安装创意工坊地图模组时会自动前置注入模组地图目录）
  type: text
- name: server.PVP
  label: 开启玩家间伤害
  default: 'true'
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 玩家可以攻击或杀害其他玩家
  type: boolean
- name: server.PauseEmpty
  label: 无人在线时暂停时间
  default: 'true'
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 服务器没有玩家时, 自动暂停服务器
  type: boolean
- name: server.Open
  label: 开放免白名单直接加入
  default: 'true'
  group: 基础设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 玩家可以在白名单中没有帐户的情况下加入. 如果设置为 false, 管理员必须手动创建用户名/密码组合.
  type: boolean
- name: server.DefaultPort
  label: DefaultPort
  default: '16261'
  group: 服务器选项 / 服务器信息
  fileTarget: Zomboid/Server/servertest.ini
  help: 玩家数据的默认起始端口. 如果是 UDP, 这是使用的两个端口之一. 最小值=0 最大值=65535 默认=16261
  type: number
  min: 0.0
  max: 65535.0
  step: 1
- name: server.Public
  label: Public
  default: 'false'
  group: 服务器选项 / 服务器信息
  fileTarget: Zomboid/Server/servertest.ini
  help: '在游戏内浏览器中显示服务器. (注意: 启用 Steam 的服务器在 Steam 服务器浏览器中始终可见)'
  type: boolean
- name: server.UDPPort
  label: UDPPort
  default: '16262'
  group: 服务器选项 / Steam 设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 最小值=0 最大值=65535 默认=16262
  type: number
  min: 0.0
  max: 65535.0
  step: 1
- name: server.MaxAccountsPerUser
  label: MaxAccountsPerUser
  default: '0'
  group: 服务器选项 / Steam 设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 限制单个 Steam 用户的账户数量, 当使用'主机'按钮时被忽略. 最小值=0 最大值=2147483647 默认=0
  type: number
  min: 0.0
  max: 2147483647.0
  step: 1
- name: server.SteamScoreboard
  label: SteamScoreboard
  default: 'false'
  group: 服务器选项 / Steam 设置
  fileTarget: Zomboid/Server/servertest.ini
  help: 在玩家列表中显示 Steam 用户名和头像.
  type: boolean
- name: server.BackupsCount
  label: BackupsCount
  default: '5'
  group: 服务器选项 / 备份
  fileTarget: Zomboid/Server/servertest.ini
  help: 最小值=1 最大值=300 默认=5
  type: number
  min: 1.0
  max: 300.0
  step: 1
- name: server.BackupsOnStart
  label: BackupsOnStart
  default: 'true'
  group: 服务器选项 / 备份
  fileTarget: Zomboid/Server/servertest.ini
  type: boolean
