image: registry.cn-hangzhou.aliyuncs.com/gamepanel-lite/runtime:latest
preStartCommand: |
  chmod +x ./start-server.sh 2>/dev/null || true
  mkdir -p /data/Zomboid/Server
  if [ -f /data/ProjectZomboid64.json ]; then
    cp /data/ProjectZomboid64.json /data/ProjectZomboid64.json.gp.tmp
    mv -f /data/ProjectZomboid64.json.gp.tmp /data/ProjectZomboid64.json
    mem_mb="$(printf '%s' "${MEMORY:-4096M}" | tr -cd '0-9')"
    [ -n "$mem_mb" ] || mem_mb=4096
    if [ "$mem_mb" -gt 2560 ]; then
      mem_mb=$((mem_mb - 1536))
    fi
    sed -i "s/-Xmx[0-9a-zA-Z]*/-Xmx${mem_mb}m/g" /data/ProjectZomboid64.json
  fi
startupCommand: exec ./start-server.sh -servername "${SERVER_NAME:-servertest}" -adminpassword "${ADMIN_PASSWORD:-pzadmin123}"
preStopCommand: |
  printf 'save\nquit\n' > /proc/1/fd/0 2>/dev/null || true
  i=0
  while [ "$i" -lt 20 ] && pgrep -f '[P]rojectZomboid' >/dev/null 2>&1; do
    i=$((i+1))
    sleep 0.5
  done
ports:
- name: game
  protocol: UDP
  targetPort: 16261
- name: query
  protocol: UDP
  targetPort: 16262
published: true
recommendedPlan: pro
recommendedVersion: latest
resources:
  cpu: '4'
  memory: 8Gi
  storage: 20Gi
summary: 支持肯塔基州末日/幸存者/建造者沙盒预设、丧尸移速与传染机制、断水断电时间及 Steam 创意工坊模组配置。
tagline: 硬核末日生存 · 双 UDP 端口与沙盒规则
versions:
- latest
consoleDelivery: stdin
consoleActions:
- id: pz-save
  title: 立即保存世界
  group: 世界事件
  command: save
  starred: true
- id: pz-rain
  title: 天气降雨控制
  group: 世界事件
  command: '{{cmd}}'
  starred: true
  params:
  - name: cmd
    label: 降雨指令
    type: select
    defaultValue: startrain
    options:
    - value: startrain
      label: 开始下雨
    - value: stoprain
      label: 停止下雨
- id: pz-chopper
  title: 触发直升机事件
  group: 世界事件
  command: chopper
  starred: false
- id: pz-servermsg
  title: 全服红字广播
  group: 玩家权限
  command: servermsg "{{msg}}"
  starred: true
  params:
  - name: msg
    label: 广播消息
    type: text
    defaultValue: 请各位幸存者做好防尸潮准备
- id: pz-additem
  title: 给予玩家物品
  group: 玩家权限
  command: additem "{{player}}" "{{item}}" {{count}}
  starred: true
  params:
  - name: player
    label: 角色名
    type: text
    defaultValue: admin
  - name: item
    label: 物品 ID
    type: text
    defaultValue: Base.Axe
  - name: count
    label: 数量
    type: number
    defaultValue: '1'
- id: pz-kick
  title: 踢出幸存者
  group: 玩家权限
  command: kickuser "{{player}}"
  starred: false
  danger: true
  params:
  - name: player
    label: 角色名
    type: text
storagePolicy:
  backupSubtree: Zomboid
  anchorFiles:
  - Saves
  replaceOnRestore: true
  backupRequiresStop: true
  preBackupCommand: save
  regeneratePaths:
  - Zomboid/Saves
metrics:
- id: online_players
  label: 在线玩家
  unit: 人
  mode: regex_value
  probeCommand: players
  pattern: 'Players connected \((\d+)\):'
  itemPattern: '(?:^|>\s*)-\s*([^\r\n]+)'
  incPattern: '"([^"]+)"\s+fully connected'
  decPattern: disconnected player\s+"?([^"\s]+)"?
  maxConfigKey: server.MaxPlayers
  bindParam: player
  quickActionIds:
  - pz-additem
  - pz-kick
