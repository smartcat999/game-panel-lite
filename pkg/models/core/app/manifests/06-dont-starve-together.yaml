apiVersion: core.gamepanel.io/v1
kind: App
metadata:
  creationTimestamp: '0001-01-01T00:00:00Z'
  generation: 0
  labels:
    gamepanel.io/builtin: 'true'
    gamepanel.io/category: survival
  name: dont-starve-together
  resourceVersion: ''
  uid: ''
builtIn: true
serverBinding:
  repository: dst-server
  package: dst-server
  targetPath: .
addonBinding:
  repository: dst-workshop
  installMode: dst_local_mods
  targetDir: mods
capabilities:
- console
- mods
- files
- backups
category: survival
configPresets:
- id: endless-coop
  name: 无尽合作模式（绚丽之门无限复活）
  description: 死亡后可在出生点绚丽之门直接复活，全灭不重置世界，开启地下洞穴
  values:
    identity.serverName: 饥荒无尽联机服
    gameplay.gameMode: endless
    gameplay.maxPlayers: '8'
    gameplay.pvp: 'false'
    gameplay.pauseWhenEmpty: 'true'
    caves.enabled: 'true'
    world.overrides.portalresurection: always
    world.overrides.resettime: none
- id: survival-classic
  name: 经典生存模式（全员阵亡世界重置）
  description: 官方原版合作生存体验，固定出生门，全员变鬼魂后倒计时重置世界
  values:
    identity.serverName: 饥荒经典生存服
    gameplay.gameMode: survival
    gameplay.maxPlayers: '6'
    gameplay.pvp: 'false'
    gameplay.pauseWhenEmpty: 'true'
    caves.enabled: 'true'
    world.overrides.portalresurection: none
    world.overrides.resettime: default
- id: rich-resources
  name: 丰饶养老开荒（多资源·长秋季·少袭击）
  description: 调高树枝、草、浆果与矿石密度，延长开局秋季，降低猎犬袭击频率
  values:
    identity.serverName: 饥荒丰饶养老服
    gameplay.gameMode: endless
    gameplay.maxPlayers: '10'
    caves.enabled: 'true'
    world.overrides.flint: often
    world.overrides.grass: often
    world.overrides.sapling: often
    world.overrides.berrybush: often
    world.overrides.rock: often
    world.overrides.autumn: longseason
    world.overrides.hounds: rare
configSchema:
- name: identity.serverName
  label: 服务器名称
  type: text
  required: true
  default: DST Friends
  group: 基础设置
  help: 显示在饥荒大厅列表中的房间名称
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: identity.clusterName
  label: 集群存档名称
  type: text
  required: true
  default: GamePanelCluster
  group: 基础设置
  help: 集群存档目录标识
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: identity.description
  label: 服务器描述
  type: text
  default: 由 GamePanel Lite 驱动的饥荒联机服
  group: 基础设置
  help: 大厅房间详情页显示的欢迎说明
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: identity.password
  label: 服务器密码
  type: password
  default: ''
  group: 基础设置
  help: 留空表示公开免密进入
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: identity.clusterToken
  label: Klei 服务器令牌
  type: password
  required: false
  default: ''
  group: 基础设置
  help: 在 Klei 账号页面创建专用服务器令牌 (pds-g^...) 后填入；留空时自动降级为局域网离线模式启动
  envKey: DST_CLUSTER_TOKEN
  fileTarget: DoNotStarveTogether/Cluster_1/cluster_token.txt
- name: identity.visibility
  label: 可见性
  type: select
  required: true
  default: public
  group: 基础设置
  help: 控制服务器在公共大厅中的展示方式
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
  options:
  - value: public
    label: 公开
  - value: lan
    label: 局域网
  - value: offline
    label: 离线
  envKey: CLUSTER_VISIBILITY
- name: gameplay.gameMode
  label: 游戏模式
  type: select
  required: true
  default: endless
  group: 基础设置
  help: 生存 / 无尽（绚丽之门复活） / 荒野（随机出生）
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
  options:
  - value: survival
    label: 生存
  - value: endless
    label: 无尽
  - value: wilderness
    label: 荒野
- name: gameplay.maxPlayers
  label: 最大玩家数
  type: number
  required: true
  default: '6'
  min: 1
  max: 64
  step: 1
  group: 基础设置
  help: 允许同时在线的冒险家人数上限 (1–64)
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: world.preset
  label: 世界预设
  type: select
  required: true
  default: forest_default
  group: 基础设置
  help: 地上森林世界的基础生成模板
  fileTarget: DoNotStarveTogether/Cluster_1/Master/worldgenoverride.lua
  options:
  - value: forest_default
    label: 默认森林
  - value: forest_classic
    label: 经典森林
  - value: forest_survival
    label: 生存森林
- name: gameplay.pvp
  label: 开启 PVP
  type: boolean
  default: 'false'
  group: 基础设置
  help: 允许玩家之间互相造成伤害
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: gameplay.pauseWhenEmpty
  label: 无人时暂停
  type: boolean
  default: 'true'
  group: 基础设置
  help: 服务器无玩家在线时自动冻结世界时间
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: gameplay.consoleEnabled
  label: 启用控制台
  type: boolean
  default: 'true'
  group: 基础设置
  help: 允许管理员执行远程 Lua 控制台指令
  fileTarget: DoNotStarveTogether/Cluster_1/cluster.ini
- name: caves.enabled
  label: 启用洞穴世界
  type: boolean
  default: 'true'
  group: 基础设置
  help: 同时开启地下洞穴世界进程与专属世界参数
  envKey: ENABLE_CAVES
