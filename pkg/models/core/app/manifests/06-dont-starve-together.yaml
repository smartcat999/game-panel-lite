image: registry.cn-hangzhou.aliyuncs.com/gamepanel-lite/runtime:latest
preStartCommand: |
  chmod +x /data/bin64/dontstarve_dedicated_server_nullrenderer_x64 2>/dev/null || true
  mkdir -p /data/DoNotStarveTogether/Cluster_1/Master /data/DoNotStarveTogether/Cluster_1/Caves
  for f in /data/DoNotStarveTogether/Cluster_1/Master/leveldataoverride.lua /data/DoNotStarveTogether/Cluster_1/Caves/leveldataoverride.lua; do
    if [ -f "$f" ] && ! grep -q 'desc' "$f"; then
      rm -f "$f"
    fi
  done
  if [ -n "${DST_CLUSTER_TOKEN:-}" ]; then
    printf '%s\n' "${DST_CLUSTER_TOKEN}" > /data/DoNotStarveTogether/Cluster_1/cluster_token.txt
  fi
  if [ ! -f /data/DoNotStarveTogether/Cluster_1/cluster_token.txt ] || ! grep -q '[^[:space:]]' /data/DoNotStarveTogether/Cluster_1/cluster_token.txt; then
    echo "[GamePanel] Klei cluster_token.txt is empty — automatically enabling LAN offline cluster mode."
    if [ -f /data/DoNotStarveTogether/Cluster_1/cluster.ini ]; then
      sed -i 's/^lan_only_cluster = .*/lan_only_cluster = true/' /data/DoNotStarveTogether/Cluster_1/cluster.ini
      sed -i 's/^offline_cluster = .*/offline_cluster = true/' /data/DoNotStarveTogether/Cluster_1/cluster.ini
    fi
  fi
  mkdir -p /data/mods
  [ -f /data/mods/dedicated_server_mods_setup.lua ] || : > /data/mods/dedicated_server_mods_setup.lua
  if [ "${ENABLE_CAVES:-true}" = "true" ]; then
    rm -f /tmp/dst-caves.in
    mkfifo /tmp/dst-caves.in
    (tail -n +1 -f /tmp/dst-caves.in | { cd /data/bin64 && exec ./dontstarve_dedicated_server_nullrenderer_x64 -console -persistent_storage_root /data -conf_dir DoNotStarveTogether -cluster Cluster_1 -shard Caves; } 2>&1 | sed -u 's/^/[Caves] /' &)
  fi
startupCommand: cd /data/bin64 && exec ./dontstarve_dedicated_server_nullrenderer_x64 -console -persistent_storage_root /data
  -conf_dir DoNotStarveTogether -cluster Cluster_1 -shard Master
preStopCommand: |
  dst-send-to-console "c_save()" >/dev/null 2>&1 || true
  sleep 1
  dst-send-to-console "c_shutdown(true)" >/dev/null 2>&1 || true
  if [ -p /tmp/dst-caves.in ]; then timeout 1 sh -c 'printf "c_shutdown(true)\n" > /tmp/dst-caves.in' 2>/dev/null || true; fi
  i=0
  while [ "$i" -lt 15 ] && pgrep -f '[d]ontstarve_dedicated_server_nullrenderer' >/dev/null 2>&1; do
    i=$((i+1))
    sleep 0.5
  done
ports:
- name: master
  protocol: UDP
  targetPort: 10999
- name: caves
  protocol: UDP
  targetPort: 11000
published: true
recommendedPlan: standard
recommendedVersion: latest
resources:
  cpu: '2'
  memory: 4Gi
  storage: 20Gi
summary: 支持 Klei 令牌配置（免令牌自动降级局域网离线）、无尽/生存/荒野模式切换、双 Shard（地面+洞穴）联动、Steam 创意工坊模组及四季资源生成规则。
tagline: 哥特风荒野生存 · 地面森林 + 洞穴双世界
versions:
- latest
consoleDelivery: dst-send-to-console
consoleActions:
- id: dst-skip-day
  title: 跳过 1 天
  group: 时间季节
  command: c_skip(1)
  starred: true
- id: dst-season
  title: 切换季节
  group: 时间季节
  command: TheWorld:PushEvent("ms_setseason", "{{season}}")
  starred: true
  params:
  - name: season
    label: 季节
    type: select
    defaultValue: autumn
    options:
    - value: spring
      label: 春
    - value: summer
      label: 夏
    - value: autumn
      label: 秋
    - value: winter
      label: 冬
- id: dst-rain
  title: 降水控制
  group: 时间季节
  command: TheWorld:PushEvent("ms_forceprecipitation", {{rain}})
  starred: false
  params:
  - name: rain
    label: 状态
    type: select
    defaultValue: 'true'
    options:
    - value: 'true'
      label: 开始下雨
    - value: 'false'
      label: 停止下雨
- id: dst-save
  title: 立即保存存档
  group: 存档回档
  command: c_save()
  starred: true
- id: dst-rollback
  title: 世界回档
  group: 存档回档
  command: c_rollback({{days}})
  starred: true
  params:
  - name: days
    label: 回档天数
    type: select
    defaultValue: '1'
    options:
    - value: '1'
      label: 1天
    - value: '2'
      label: 2天
    - value: '3'
      label: 3天
    - value: '5'
      label: 5天
- id: dst-regenerate
  title: 重新生成世界
  group: 存档回档
  command: c_regenerateworld()
  starred: false
- id: dst-announce
  title: 全服公告广播
  group: 玩家管理
  command: c_announce("{{msg}}")
  starred: true
  params:
  - name: msg
    label: 公告内容
    type: text
    defaultValue: 服务器将在 5 分钟后重启维护
- id: dst-give
  title: 给指定玩家刷物品
  group: 玩家管理
  command: c_give("{{item}}", {{count}})
  starred: true
  params:
  - name: item
    label: 物品代码
    type: text
    defaultValue: cutgrass
  - name: count
    label: 数量
    type: number
    defaultValue: '10'
- id: dst-kick
  title: 踢出玩家
  group: 玩家管理
  command: TheNet:Kick("{{player}}")
  starred: false
  danger: true
  params:
  - name: player
    label: 玩家名或 KU_ID
    type: text
- id: dst-spawn
  title: 生成指定生物或 Boss
  group: 世界事件
  command: c_spawn("{{prefab}}", {{count}})
  starred: false
  params:
  - name: prefab
    label: 生物代码
    type: text
    defaultValue: deerclops
  - name: count
    label: 数量
    type: number
    defaultValue: '1'
consoleTargets:
- id: master
  label: 地上世界
  format: '{{command}}'
- id: caves
  label: 洞穴世界
  format: __GAMEPANEL_DST_CONSOLE__:caves:{{command_base64}}
  enabledField: caves.enabled
storagePolicy:
  backupSubtree: DoNotStarveTogether/Cluster_1
  anchorFiles:
  - cluster.ini
  - Master/server.ini
  replaceOnRestore: true
  backupRequiresStop: false
  preBackupCommand: c_save()
  regeneratePaths:
  - DoNotStarveTogether/Cluster_1/Master/save
  - DoNotStarveTogether/Cluster_1/Caves/save
metrics:
- id: online_players
  label: 在线玩家
  unit: 人
  mode: regex_value
  probeCommand: local n=0; local out={}; for _,v in ipairs(TheNet:GetClientTable() or {}) do if v.performance==nil then n=n+1; table.insert(out, string.format("GP_PLAYER=%s (%s)", v.name or "Player", v.userid or "")) end end; print("GP_ONLINE=" .. tostring(n)); for _,s in ipairs(out) do print(s) end
  pattern: GP_ONLINE=(\d+)
  incPattern: \[Join Announcement\]\s*([^\r\n]+)
  decPattern: \[Leave Announcement\]\s*([^\r\n]+)
  maxConfigKey: gameplay.maxPlayers
  itemPattern: GP_PLAYER=([^\r\n]+)
  bindParam: player
  quickActionIds:
  - dst-kick
- id: world_cycles
  label: 世界天数
  unit: 天
  mode: regex_value
  probeCommand: print("GP_CYCLE=" .. tostring((TheWorld and TheWorld.state and TheWorld.state.cycles or 0) + 1))
  pattern: GP_CYCLE=(\d+)
