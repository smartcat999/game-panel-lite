coverImage: /landing/games/dont-starve-together.jpg
displayName: 饥荒联机版 Don't Starve Together
env:
  DST_CLUSTER_NAME: GamePanelDST
fileTemplates:
- path: DoNotStarveTogether/Cluster_1/cluster.ini
  content: |
    # Cluster: {{identity.clusterName}} | Visibility: {{identity.visibility}}
    [GAMEPLAY]
    game_mode = {{gameplay.gameMode}}
    max_players = {{gameplay.maxPlayers}}
    pvp = {{gameplay.pvp}}
    pause_when_empty = {{gameplay.pauseWhenEmpty}}

    [NETWORK]
    cluster_name = {{identity.serverName}}
    cluster_description = {{identity.description}}
    cluster_password = {{identity.password}}
    cluster_intention = cooperative
    lan_only_cluster = {{ if eq (index .Values "identity.visibility") "lan" }}true{{ else }}false{{ end }}
    offline_cluster = {{ if eq (index .Values "identity.visibility") "offline" }}true{{ else }}false{{ end }}

    [MISC]
    console_enabled = {{gameplay.consoleEnabled}}

    [SHARD]
    shard_enabled = true
    bind_ip = 127.0.0.1
    master_ip = 127.0.0.1
    master_port = 10888
    cluster_key = defaultPass
- path: DoNotStarveTogether/Cluster_1/cluster_token.txt
  content: |
    {{identity.clusterToken}}
- path: DoNotStarveTogether/Cluster_1/Master/server.ini
  content: |
    [NETWORK]
    server_port = 10999

    [SHARD]
    is_master = true

    [STEAM]
    master_server_port = 27018
    authentication_port = 8768
- path: DoNotStarveTogether/Cluster_1/Caves/server.ini
  content: |
    [NETWORK]
    server_port = 11000

    [SHARD]
    is_master = false
    name = Caves
    id = 2

    [STEAM]
    master_server_port = 27019
    authentication_port = 8769
