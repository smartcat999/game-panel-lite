name: Backend
on:
  pull_request:
  push:
    branches: [main, feat/v1-full-run]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: gamepanel_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          unformatted=$(git ls-files -z '*.go' ':!:vendor/**' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Build standalone Linux Agent
        run: CGO_ENABLED=0 GOOS=linux go build -o "$RUNNER_TEMP/gamepanel-agent" ./apps/agent
      - name: Test behavior and architecture boundaries
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check registry and runtime races
        run: go test -race ./apps/api/internal/provider/... ./apps/api/internal/runtime/... ./apps/api/internal/gameconfig ./apps/api/internal/modruntime ./apps/api/internal/server ./internal/...
      - name: Test disposable Docker runtime
        env:
          GAMEPANEL_TEST_DOCKER_HOST: unix:///var/run/docker.sock
        run: go test -count=1 -run TestDockerIntegration -v ./internal/runtime/docker

      - name: Test PostgreSQL persistence in an isolated schema
        env:
          GAMEPANEL_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/gamepanel_test?sslmode=disable
        run: go test -count=1 -run TestPostgresIntegration -v ./apps/api/internal/store
