services:
  certbot:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/certbot:${GAMEPANEL_CERTBOT_TAG:-v2.11.0}
    profiles:
      - certificate
    volumes:
      - ./data/certbot/www:/var/www/certbot
      - ./data/certbot/conf:/etc/letsencrypt

  nginx:
    image: ${GAMEPANEL_IMAGE_REGISTRY:-smartcat99999}/nginx:${GAMEPANEL_NGINX_TAG:-1.27-alpine}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${GAMEPANEL_WEB_PORT:-80}:80"
      - "${GAMEPANEL_HTTPS_PORT:-443}:443"
    volumes:
      - ./data/nginx/gamepanel-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
