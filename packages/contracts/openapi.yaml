openapi: 3.1.0
info:
  title: GamePanel Lite API
  version: 0.1.0
servers:
  - url: http://localhost:4000
paths:
  /api/regions:
    get:
      summary: List the global Region directory
      description: Returns persisted Region identities and create-admission state. The global directory does not infer Regions or node counts from legacy node records.
      parameters:
        - in: query
          name: after
          schema: {type: string}
          description: Stable Region ID cursor.
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        "200":
          description: Bounded Region directory page.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionDirectoryEntry"
        "400": {description: Invalid cursor or limit}
  /api/games:
    get:
      summary: List the registered game and Provider catalog
      responses:
        "200":
          description: Provider uploadExtensions exposes user-upload formats only, excluding internal auxiliary cache files. Missing or empty extensions mean local uploads are unavailable. Clients must not infer formats from game names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [key, name, providers]
                  properties:
                    key: {type: string}
                    name: {type: string}
                    providers:
                      type: array
                      items:
                        type: object
                        required: [key, name, capabilities]
                        properties:
                          key: {type: string}
                          name: {type: string}
                          capabilities:
                            type: object
                            properties:
                              mods: {type: boolean}
                          uploadExtensions:
                            type: array
                            items: {type: string}
  /api/auth/me/mods:
    get:
      security:
        - sessionCookie: []
      summary: List library mods in the current account's workspaces
      description: Requires an authenticated account with mod management permission. Current workspace membership is checked in SQL. This endpoint does not include legacy unowned library records or instance mods.
      responses:
        "200":
          description: Workspace library records
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ModFile'}
        "401": {description: Authentication required}
        "403": {description: Mod management permission required}
  /api/auth/me/mods/upload:
    post:
      security:
        - sessionCookie: []
      summary: Upload an immutable workspace library file
      description: The raw file body is bounded by GAMEPANEL_MOD_UPLOAD_MAX_BYTES (default 256 MiB). Workspace write permission is checked before consuming the body and again at commit. Optional Provider metadata inspection is enforced when supplied; this is not a complete package security scan. The server generates the upload ID. Existing filenames in the same workspace and Provider are rejected.
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: {type: string, minLength: 1}
        - in: query
          name: providerKey
          required: true
          schema: {type: string, minLength: 1}
        - in: query
          name: fileName
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: File published and metadata committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModFile'}
        "400": {description: Invalid upload or package metadata}
        "401": {description: Authentication required}
        "403": {description: Workspace write permission required, including revocation during upload}
        "404": {description: Workspace not found}
        "409": {description: Filename already exists in the workspace and Provider}
        "413": {description: Configured upload size limit exceeded}
        "415": {description: application/octet-stream required}
        "500": {description: Upload failed}
        "503":
          description: File retained after an uncertain commit or failed cleanup; requires reconciliation. Do not assume that the metadata was committed or blindly delete the file.
          content:
            application/json:
              schema:
                type: object
                required: [error, uploadId]
                properties:
                  error: {type: string}
                  uploadId: {type: string}
  /api/config-presets:
    get:
      summary: List presets visible through current workspace membership
      responses:
        "200":
          description: Customers see owned workspace presets only. Platform administrators retain global access. Password fields are redacted, including historical presets.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ConfigPreset'}
    post:
      summary: Create a workspace-owned configuration preset
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigPresetInput'}
      responses:
        "201":
          description: Created after transactional membership verification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigPreset'}
        "400": {description: Invalid input or workspace selection required}
        "403": {description: Workspace write permission required}
        "404": {description: Workspace not found}
  /api/config-presets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string}
    get:
      summary: Read a visible preset with credentials redacted
      responses:
        "200":
          description: Visible preset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigPreset'}
        "404": {description: Preset missing or outside current memberships}
    put:
      summary: Replace preset content while preserving workspace ownership
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigPresetInput'}
      responses:
        "200":
          description: Updated preset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigPreset'}
        "400": {description: Invalid input or attempt to change workspace}
        "403": {description: Workspace write permission required}
        "404": {description: Preset missing or outside current memberships}
        "409": {description: Preset changed or was deleted during the request}
    delete:
      summary: Delete a visible preset after transactional permission and revision checks
      responses:
        "204": {description: Deleted}
        "403": {description: Workspace write permission required}
        "404": {description: Preset missing or outside current memberships}
        "409": {description: Preset changed or was deleted during the request}
  /api/config-presets/batch-delete:
    post:
      summary: Delete up to 100 unique presets, checking each independently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: {type: string}
      responses:
        "200":
          description: Per-item results; foreign presets fail without being deleted
          content:
            application/json:
              schema:
                type: object
                required: [succeeded, failed]
                properties:
                  succeeded:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        error: {type: string}
        "400": {description: Empty or oversized unique ID list}
  /api/agent/register:
    post:
      summary: Register Agent hardware and configured workload capabilities
      description: Authenticates the node token in the JSON body. Workload capabilities are derived from configured runtime support. Omitted capabilities clear prior support for downgraded or legacy Agents; only recognized capabilities are persisted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                runtimeArchitecture:
                  type: string
                  description: Docker daemon architecture, independent of Agent OSInfo. Known aliases are normalized; omitted, empty, or unrecognized values clear prior architecture evidence.
                workloadCapabilities:
                  type: array
                  items: {type: string}
                  description: Currently recognizes artifacts-v1. Additional hardware or heartbeat metric fields are accepted by the existing Agent protocol.
      responses:
        "200": {description: Node report accepted}
        "400": {description: Invalid report}
        "401": {description: Invalid node token}
        "409": {description: Node report superseded or node authorization changed before persistence}
        "500": {description: Node lookup or persistence failed}
  /api/agent/heartbeat:
    post:
      summary: Refresh Agent liveness and configured workload capabilities
      description: Authenticates the node token in the JSON body. Workload capabilities are derived from configured runtime support. Omitted capabilities clear prior support for downgraded or legacy Agents; only recognized capabilities are persisted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                runtimeArchitecture:
                  type: string
                  description: Docker daemon architecture, independent of Agent OSInfo. Known aliases are normalized; omitted, empty, or unrecognized values clear prior architecture evidence.
                workloadCapabilities:
                  type: array
                  items: {type: string}
                  description: Currently recognizes artifacts-v1. Additional hardware or heartbeat metric fields are accepted by the existing Agent protocol.
      responses:
        "200": {description: Node report accepted}
        "400": {description: Invalid report}
        "401": {description: Invalid node token}
        "409": {description: Node report superseded or node authorization changed before persistence}
        "500": {description: Node lookup or persistence failed}
  /api/agent/assignments/{uid}/lease:
    post:
      summary: Acquire, renew or release an execution lease for an exact assignment
      description: Requires the owning node token and current instance/assignment generation. A fresh holderId identifies each reconciliation attempt. Acquire uses fence 0; renew/release require the granted positive fence. Conflicts do not authorize execution. New Agents require a lease and renew before each lifecycle mutation, but runtime fencing and lost-node shutdown remain separate work.
      security:
        - nodeToken: []
      parameters:
        - in: path
          name: uid
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, generation, holderId]
              properties:
                action: {type: string, enum: [acquire, renew, release]}
                generation: {type: integer, minimum: 1}
                holderId: {type: string, minLength: 1, maxLength: 128}
                fence: {type: integer, format: int64, minimum: 0, default: 0}
      responses:
        "200":
          description: Confirmed acquire or renewal. Treat validForMs conservatively from the client request start, never from receipt. No clock synchronization with the API host is required for that local deadline.
          content:
            application/json:
              schema:
                type: object
                required: [assignmentUid, serverId, nodeId, generation, holderId, fence, validForMs]
                properties:
                  observationToken:
                    type: string
                    description: Returned on acquisition, including an empty string when no report exists. Snapshot taken in the lease transaction; use it instead of the earlier polling token. Renewal does not replace the execution attempt's report token.
                  assignmentUid: {type: string}
                  serverId: {type: string}
                  nodeId: {type: string}
                  generation: {type: integer, minimum: 1}
                  holderId: {type: string}
                  fence: {type: integer, format: int64, minimum: 1}
                  validForMs: {type: integer, format: int64, enum: [120000]}
        "204": {description: Released. Release only after all operations and cleanup have completed successfully.}
        "400": {description: Invalid action, identity, fence or request body}
        "401": {description: Missing or invalid node token}
        "409": {description: Lease held, expired, superseded or no longer authorized}
        "500": {description: Persistence failed; execution is not authorized by an uncertain response}
  /api/agent/assignments:
    get:
      summary: Poll assignments for the authenticated node
      security:
        - nodeToken: []
      parameters:
        - in: header
          name: X-Workload-Capabilities
          required: false
          description: Comma-separated capabilities. All polls require execution-lease-v1; older workers receive 409 and must be upgraded. A worker may advertise artifacts-v1 only after its authorized artifact source and resource limits are configured. A running artifact workload causes a 409 response when this capability is absent. Stopping or deleting does not require artifact downloads, but still requires an execution lease.
          schema:
            type: string
      responses:
        "200":
          description: Assigned workloads, each carrying the current observationToken (empty before the first report). Echo this token in the next report; after a conflict, poll and observe again.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [uid, serverId, nodeId, generation, desiredState, spec, observationToken]
                  properties:
                    uid: {type: string}
                    serverId: {type: string}
                    nodeId: {type: string}
                    generation: {type: integer}
                    desiredState: {type: string}
                    spec:
                      type: object
                      properties:
                        options:
                          type: object
                          properties:
                            artifacts:
                              type: array
                              description: Immutable file references. No host paths or arbitrary download URLs. Authorized node download is available for persisted manifests; production Agent downloads are configured; the control-plane builder publishes same-workspace uploaded sources and their dependency closure. Customer requests support online artifact-capable nodes; cross-host runtime verification remains pending.
                              items:
                                type: object
                                required: [id, path, sha256, sizeBytes]
                                properties:
                                  id:
                                    type: string
                                    maxLength: 128
                                    pattern: '^[A-Za-z0-9_-]+$'
                                  revision:
                                    type: integer
                                    minimum: 0
                                    default: 0
                                    description: Library metadata revision pinned by the publisher; omitted legacy descriptors mean revision zero. Referenced sources cannot be edited or deleted until the persisted manifest releases them.
                                  path:
                                    type: string
                                    description: Canonical relative slash-separated destination, without traversal or configuration conflicts
                                  sha256:
                                    type: string
                                    pattern: '^[a-f0-9]{64}$'
                                  sizeBytes:
                                    type: integer
                                    minimum: 1
                    observationToken: {type: string}
        "401":
          description: Invalid node token
        "409":
          description: Agent lacks execution-lease-v1 or the artifact capability required by a running assignment
        "500":
          description: Assignment or observation storage unavailable
  /api/agent/assignments/{uid}/artifacts/{artifactId}:
    get:
      summary: Download an uploaded workspace artifact for the current node assignment
      description: Requires the owning node token, a current running assignment and instance generation, an active execution lease held by the caller, and a manifest entry matching the library record's workspace, provider, size and SHA-256. Authorization is rechecked after opening the file and the node token is checked again before streaming. The worker must verify the received bytes before replacing a container. Production Agent downloads are configured; the control-plane builder publishes same-workspace uploaded sources and their dependency closure. Customer requests support online artifact-capable nodes; cross-host runtime verification remains pending.
      security:
        - nodeToken: []
      parameters:
        - in: path
          name: uid
          required: true
          schema: {type: string}
        - in: path
          name: artifactId
          required: true
          schema: {type: string}
        - in: query
          name: generation
          required: true
          schema: {type: integer, minimum: 1}
        - in: query
          name: holderId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - in: query
          name: fence
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: Raw immutable-library file bytes; no range support
          headers:
            ETag:
              schema: {type: string}
              description: Quoted SHA-256 from the assignment manifest
            Content-Length:
              schema: {type: integer}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "400": {description: Invalid generation or execution lease identity}
        "401": {description: Missing, invalid or changed node token}
        "404": {description: No current authorized assignment artifact}
        "409": {description: Execution lease expired, superseded, or assignment metadata changed}
        "503": {description: File unavailable or no longer matches the declared size}
        "500": {description: Authorization lookup failed}
  /api/agent/assignments/{uid}/status:
    post:
      summary: Conditionally publish a runtime observation
      security:
        - nodeToken: []
      parameters:
        - name: uid
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observedGeneration, actualState, leaseHolderId, leaseFence]
              properties:
                observationToken:
                  type: string
                  description: Token from assignment polling. Required for writes after the first observation; successful writes rotate it. The report must also hold the current execution lease and match the exact current instance and assignment generation.
                leaseHolderId: {type: string, minLength: 1, maxLength: 128}
                leaseFence: {type: integer, format: int64, minimum: 1}
                observedGeneration: {type: integer, minimum: 1}
                actualState: {type: string}
                runtimeId: {type: string}
                lastError: {type: string}
                observedAt: {type: string, format: date-time}
                reconcileDurationSeconds: {type: number, minimum: 0, maximum: 600}
                conditions:
                  type: array
                  items: {type: object}
      responses:
        "200":
          description: Report committed under the active execution lease. Reporting does not extend the lease; release only after receiving confirmation.
        "400":
          description: Invalid JSON, reconcile duration or missing lease identity
        "401":
          description: Invalid node token
        "403":
          description: Assignment belongs to another node
        "404":
          description: Assignment not found
        "409":
          description: Execution lease expired/released/superseded, node authorization changed, observation token expired, or generation invalid. Poll and observe again; do not retry an old report under a new lease.
        "500":
          description: Observation storage unavailable
  /api/auth/password:
    post:
      summary: Change the current account password and rotate its sessions
      description: Password update, revocation of all old sessions and issuance of the current browser replacement session commit atomically. Concurrent credential changes return 409.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Account response with a replacement session cookie
        "401":
          description: Session missing or current password incorrect
        "409":
          description: Credentials changed concurrently; authenticate again
        "500":
          description: Persistence failed; authenticate again to confirm the current credential state
  /api/users/{id}/password:
    put:
      summary: Reset an account password and revoke all target sessions
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Target password changed and sessions revoked; no replacement session issued
        "403":
          description: Platform administrator permission required
        "404":
          description: Account not found
        "409":
          description: Credentials changed concurrently
  /api/auth/me/organizations:
    get:
      summary: List workspaces for the authenticated user's current memberships
      description: Ignores client-supplied user IDs. Platform roles do not bypass membership. Returns an empty array when no memberships remain.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current user's workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMembershipSummary"
        "401":
          description: Authentication required, including before initial setup
        "500":
          description: Persistence unavailable
  /api/auth/me/organizations/{id}:
    get:
      summary: Read a workspace through current membership
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace visible to the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalOrganization"
        "401":
          description: Authentication required
        "404":
          description: Workspace missing or user is not a current member
        "500":
          description: Persistence unavailable
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: API is healthy
  /api/version:
    get:
      summary: Product version
      responses:
        "200":
          description: Product version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelBuildInfo"
  /api/system/update:
    get:
      summary: Read GamePanel Lite update status
      responses:
        "200":
          description: Current build, latest checked release, preferences, and active update job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateStatus"
  /api/system/update/check:
    post:
      summary: Check the configured release manifest now
      responses:
        "200":
          description: Completed update check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateStatus"
        "502":
          description: Release manifest could not be checked or validated
  /api/system/update/auto-check:
    put:
      summary: Enable or disable notification-only automatic release checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Saved automatic check preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateStatus"
  /api/system/update/apply:
    post:
      summary: Queue an authenticated asynchronous control-plane update
      description: Pulls and recreates only GamePanel Lite control-plane services. Managed game server containers and save data are not modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  pattern: '^v?[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$'
      responses:
        "202":
          description: Update job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateJob"
        "409":
          description: Updater unavailable, release mismatch, already current, or another update is running
  /api/system/deployment:
    get:
      summary: Read control-plane service and HTTPS status
      responses:
        "200":
          description: Control-plane deployment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentStatus"
        "502":
          description: Updater or Docker Compose status is unavailable
  /api/system/deployment/reconcile:
    post:
      summary: Restore missing or stopped control-plane services
      responses:
        "202":
          description: Recovery job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateJob"
        "409":
          description: Another maintenance operation is running
  /api/system/deployment/restart:
    post:
      summary: Restart control-plane services without stopping game containers
      responses:
        "202":
          description: Restart job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateJob"
        "409":
          description: Another maintenance operation is running
  /api/system/deployment/https/setup:
    post:
      summary: Configure HTTPS with a validated domain and optional certificate email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                  format: hostname
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: HTTPS configuration job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateJob"
        "409":
          description: Invalid deployment state or another maintenance operation is running
  /api/system/deployment/https/renew:
    post:
      summary: Check certificate renewal and reload Nginx
      responses:
        "202":
          description: Certificate renewal job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdateJob"
        "409":
          description: HTTPS is not configured or another maintenance operation is running
  /api/runtime/docker:
    get:
      summary: Read cached Docker runtime availability
      responses:
        "200":
          description: Docker status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DockerStatus"
  /api/runtime/images/prepare:
    post:
      summary: Queue runtime image preparation
      description: Pulls and archives one provider runtime image asynchronously. Heavy runtime-image and game-update tasks are mutually exclusive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerKey]
              properties:
                providerKey:
                  $ref: "#/components/schemas/ProviderKey"
                version:
                  type: string
      responses:
        "200":
          description: Runtime image is already ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeImageStatus"
        "202":
          description: Runtime image preparation accepted or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeImageStatus"
        "400":
          description: Invalid JSON body
        "404":
          description: Provider not found
        "409":
          description: Another runtime image or game update task is active, or the provider is unsupported
        "503":
          description: Docker runtime is unavailable
  /api/settings:
    get:
      summary: Read local API settings
      responses:
        "200":
          description: Local settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /api/settings/locale:
    put:
      deprecated: true
      summary: Update the legacy platform default language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale:
                  type: string
                  enum: [zh, en]
      responses:
        "200":
          description: Saved locale
          content:
            application/json:
              schema:
                type: object
                required: [locale]
                properties:
                  locale:
                    type: string
                    enum: [zh, en]
  /api/account/preferences:
    get:
      security:
        - sessionCookie: []
      summary: Read the current account's interface preferences
      responses:
        "200":
          description: Account-bound language and theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPreferences"
        "401": {description: Authentication required}
    put:
      security:
        - sessionCookie: []
      summary: Replace the current account's interface preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPreferences"
      responses:
        "200":
          description: Saved account preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPreferences"
        "400": {description: Unsupported locale or theme}
        "401": {description: Authentication required}
  /api/activity:
    get:
      summary: List recent activity events
      description: Customer history is filtered by persisted workspace ownership before the result limit. Revoked members cannot read it; global and unowned legacy events remain platform-only.
      responses:
        "200":
          description: Recent activity events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /api/monitoring/overview:
    get:
      summary: Read productized monitoring overview
      responses:
        "200":
          description: Monitoring overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringOverview"
  /api/monitoring/metrics:
    get:
      summary: Read global Prometheus-backed time-series metrics
      parameters:
        - name: range
          in: query
          schema:
            type: string
            default: 15m
        - name: step
          in: query
          schema:
            type: string
            default: 30s
      responses:
        "200":
          description: Global monitoring metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringMetrics"
  /api/monitoring/server-load:
    get:
      summary: Read server load table data
      responses:
        "200":
          description: Server load rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerLoadResponse"
  /api/monitoring/events:
    get:
      summary: Read monitoring event stream
      responses:
        "200":
          description: Monitoring events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringEvents"
  /api/monitoring/platform:
    get:
      summary: Read platform health and traffic metrics
      responses:
        "200":
          description: Platform monitoring metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMonitoring"
  /api/servers:
    get:
      summary: List servers
      description: Customer lists and pagination totals include only current workspace memberships. Supplying organizationId narrows the result to one accessible workspace. Platform administrators retain global visibility and can explicitly scope the inventory to one workspace.
      parameters:
        - in: query
          name: organizationId
          schema:
            type: string
          description: Explicit tenant workspace scope.
      responses:
        "200":
          description: Server list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameServer"
    post:
      summary: Create server
      description: Creates a server resource with desired state running. Customers must select a workspace with write membership; when exactly one workspace is available, it is selected automatically. Workspace instances require positive CPU and memory limits; creation atomically reserves instance count, CPU, and memory against the persisted workspace quota. Stopped instances retain reservations. Runtime reconciliation is handled asynchronously by the server controller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Created server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServer"
        "400":
          description: Invalid resources or unlimited workspace allocation
        "403":
          description: Workspace write permission required
        "404":
          description: Workspace, persisted quota, or server not found
        "409":
          description: Workspace quota exceeded, configuration changed concurrently, or a maintenance task is active
  /api/servers/{id}:
    get:
      summary: Get server
      responses:
        "200":
          description: Server detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServer"
    delete:
      summary: Queue async server deletion
      description: Sets spec.desiredState to deleted and returns the deleting resource. The controller stops/removes runtime resources and then deletes the record.
      responses:
        "202":
          description: Delete accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServer"
        "409":
          description: Concurrent configuration or runtime change, deletion already pending, or maintenance active
  /api/servers/{id}/config:
    put:
      summary: Update desired server configuration
      description: Updates spec.config/spec.network/spec.resources, bumps spec.generation, and lets the controller apply changes asynchronously. Workspace resource changes reserve quota atomically and reject stale configuration snapshots. CPU and memory must have positive limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerConfigRequest"
      responses:
        "200":
          description: Updated server config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServer"
        "400":
          description: Invalid resources or unlimited workspace allocation
        "403":
          description: Workspace write permission required
        "404":
          description: Workspace, persisted quota, or server not found
        "409":
          description: Workspace quota exceeded, configuration changed concurrently, or a maintenance task is active
  /api/servers/{id}/start:
    post:
      summary: Request server start
      description: Sets spec.desiredState to running and bumps spec.generation. The controller creates or updates runtime workload asynchronously.
      responses:
        "202":
          description: Start accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServer"
        "409":
          description: Concurrent configuration or runtime change, deletion already pending, or maintenance active
  /api/servers/{id}/stop:
    post:
      summary: Request server stop
      description: Sets spec.desiredState to stopped and bumps spec.generation. Runtime stop is handled asynchronously by the controller.
      responses:
        "202":
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServer"
        "409":
          description: Concurrent configuration or runtime change, deletion already pending, or maintenance active
  /api/servers/{id}/restart:
    post:
      summary: Request server restart
      description: Keeps spec.desiredState running and bumps spec.generation so the controller recreates/applies the workload.
      responses:
        "202":
          description: Restart accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameServer"
        "409":
          description: Concurrent configuration or runtime change, deletion already pending, or maintenance active
  /api/servers/{id}/game-update:
    parameters:
      - name: id
        in: path
        required: true
        description: Server instance ID.
        schema:
          type: string
    get:
      summary: Read game update state
      description: Compares this server's installed build with the latest Provider-scoped game-library check. Only the Palworld provider currently reports supported=true.
      responses:
        "200":
          description: Current game update state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameUpdateState"
        "404":
          description: Server not found
        "500":
          description: Update state could not be read
  /api/servers/{id}/game-update/check:
    parameters:
      - name: id
        in: path
        required: true
        description: Server instance ID.
        schema:
          type: string
    post:
      summary: Queue a game update check
      description: Compatibility alias that queues one Provider-scoped game-library version check shared by every server of this type.
      responses:
        "202":
          description: Update check accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameUpdateJob"
        "400":
          description: Game updates are not supported for this provider
        "404":
          description: Server not found
        "409":
          description: Another game update or runtime image task is already active
        "500":
          description: Update check task could not be created
        "503":
          description: Docker runtime is unavailable or lacks safe update support
  /api/providers/{providerKey}/game-update/check:
    parameters:
      - name: providerKey
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProviderKey"
    post:
      summary: Queue a Provider-scoped game version check
      description: Refreshes the latest upstream build once for the game-library Provider. All matching server instances reuse the result.
      responses:
        "202":
          description: Provider version check accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameUpdateJob"
        "400":
          description: Version checks are unsupported for this Provider
        "409":
          description: Another heavy runtime task is active
        "503":
          description: Docker runtime is unavailable
  /api/providers/{providerKey}/game-update/auto-check:
    parameters:
      - name: providerKey
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProviderKey"
    put:
      summary: Configure Provider-scoped automatic version checks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Automatic check setting updated
        "400":
          description: Invalid setting or unsupported Provider
  /api/servers/{id}/game-update/apply:
    parameters:
      - name: id
        in: path
        required: true
        description: Server instance ID.
        schema:
          type: string
    post:
      summary: Queue a game server update
      description: Creates a persistent asynchronous task that stops the server when needed, backs up Palworld save data, installs the latest build, and optionally starts the server afterward.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startAfterUpdate:
                  type: boolean
                  default: false
                  description: Start the game server after a successful update.
      responses:
        "202":
          description: Game update accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameUpdateJob"
        "400":
          description: Invalid JSON body or game updates are not supported for this provider
        "404":
          description: Server not found
        "409":
          description: Players are online or another game update or runtime image task is already active
        "500":
          description: Update task could not be created
        "503":
          description: Docker runtime is unavailable or lacks safe update support
  /api/servers/{id}/world-regeneration:
    parameters:
      - name: id
        in: path
        required: true
        description: Server instance ID.
        schema:
          type: string
    get:
      summary: Read world regeneration state for a server
      responses:
        "200":
          description: Current world regeneration capability and latest task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldRegenerationState"
        "404":
          description: Server not found
    post:
      summary: Recreate the current server world
      description: Queues a persistent server-scoped maintenance task that stops the server, creates a required full backup, isolates the provider-declared save paths, and optionally starts the server to generate a new world. Failures restore the isolated saves.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startAfter:
                  type: boolean
                  description: Start this server after its new world is generated.
      responses:
        "202":
          description: World regeneration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldRegenerationJob"
        "400":
          description: Invalid request or unsupported provider
        "404":
          description: Server not found
        "409":
          description: Players are online or another maintenance task is active
  /api/servers/{id}/command:
    post:
      summary: Send a console command to a running server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Command sent
        "409":
          description: Server is not running or a game update is active for this server
  /api/servers/{id}/logs:
    get:
      summary: Stream server logs with SSE
      description: Session, current role and workspace membership are rechecked every five seconds with a two-second query deadline. Revocation ends the stream without a final event; clients must handle EOF/reconnect authorization failure.
      responses:
        "200":
          description: SSE log stream
  /api/servers/{id}/logs/snapshot:
    get:
      summary: Read recent server log lines without following the live stream
      responses:
        "200":
          description: Recent log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSnapshot"
  /api/servers/{id}/stats:
    get:
      summary: Read runtime CPU and memory stats for a running server
      responses:
        "200":
          description: Runtime stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStats"
  /api/servers/{id}/metrics:
    get:
      summary: Read server-specific Prometheus-backed time-series metrics
      responses:
        "200":
          description: Server monitoring metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringMetrics"
  /api/servers/{id}/events:
    get:
      summary: Read server-specific monitoring events
      responses:
        "200":
          description: Server monitoring events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringEvents"
  /api/servers/{id}/mods:
    get:
      summary: List tModLoader mods
      responses:
        "200":
          description: Mod list
  /api/servers/{id}/mods/installation-requests:
    post:
      summary: Request installation of an uploaded workspace mod
      description: Requires an authenticated workspace writer with mod management permission. The instance must be stopped. Remote nodes must be online, have a heartbeat no older than 45 seconds, and advertise artifacts-v1; eligibility is rechecked in the write transaction. Appends a same-workspace, same-provider uploaded library source to desired configuration; files are installed by the planner on the next start. Remote files are delivered by the Agent on the next start. Workshop sources are not supported by this endpoint. Acknowledgement does not mean installation has completed. Refresh instance state after any uncertain response; requests are not automatically retried.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [modId, generation]
              properties:
                modId:
                  type: string
                generation:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: Desired source saved, or already present at the submitted generation
          content:
            application/json:
              schema:
                type: object
                required: [serverId, generation, modIds, state]
                properties:
                  serverId:
                    type: string
                  generation:
                    type: integer
                  modIds:
                    type: array
                    items:
                      type: string
                  state:
                    type: string
                    enum: [requested]
        "400":
          description: Invalid request, source, or provider capability
        "401":
          description: Authentication required
        "403":
          description: Workspace or platform permission denied
        "404":
          description: Instance or source is not visible to the account
        "409":
          description: Refresh required, instance must be stopped locally, or source changed
        "500":
          description: Request result could not be confirmed; refresh before submitting again
  /api/servers/{id}/mods/upload:
    post:
      summary: Upload tModLoader mod metadata or .tmod file
      responses:
        "200":
          description: Updated existing mod file record
        "201":
          description: Uploaded mod file
        "409":
          description: A game update is active for this server
  /api/servers/{id}/mods/workshop:
    post:
      summary: Import tModLoader Workshop IDs as server mod records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workshopIds]
              properties:
                workshopIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Imported Workshop mod records; runtime install.txt is generated when the server starts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModFile"
        "409":
          description: A game update is active for this server
  /api/servers/{id}/mods/{modId}:
    patch:
      summary: Enable or disable a tModLoader mod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated mod state
        "409":
          description: A game update is active for this server
    delete:
      summary: Delete tModLoader mod file
      responses:
        "200":
          description: Deleted mod
        "409":
          description: A game update is active for this server
  /api/servers/{id}/mod-configs:
    get:
      summary: List safe tModLoader ModConfigs JSON files
      responses:
        "200":
          description: Mod config file list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModConfigFile"
  /api/servers/{id}/mod-configs/upload:
    post:
      summary: Upload and validate a tModLoader ModConfigs JSON file
      responses:
        "201":
          description: Uploaded mod config
  /api/servers/{id}/mod-configs/{name}:
    get:
      summary: Read a tModLoader mod config
      responses:
        "200":
          description: Mod config content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModConfigFile"
    put:
      summary: Validate and save a tModLoader mod config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: Saved mod config
    delete:
      summary: Delete a tModLoader mod config
      responses:
        "204":
          description: Deleted mod config
  /api/mods:
    get:
      summary: List unassigned global mod library files
      responses:
        "200":
          description: Global mod library
  /api/mods/upload:
    post:
      summary: Upload a mod to the global mod library
      responses:
        "200":
          description: Updated existing global mod file record
        "201":
          description: Uploaded global mod
  /api/mods/workshop/preview:
    post:
      summary: Resolve a Steam Workshop collection and preview compatible mods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                providerKey:
                  type: string
                  enum: [terraria-tmodloader, dont-starve-together]
                  default: terraria-tmodloader
                value:
                  type: string
                  description: Numeric collection ID or an HTTPS steamcommunity.com collection URL.
                instanceId:
                  type: string
                  description: Optional target server used to calculate preview status.
      responses:
        "200":
          description: Server-resolved collection metadata and import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopPreview"
        "400":
          description: Invalid, unavailable, oversized, or unsupported collection
        "502":
          description: Steam Workshop API request failed
  /api/mods/workshop/items/preview:
    post:
      summary: Resolve Steam Workshop items and preview their current metadata before import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workshopIds]
              properties:
                providerKey:
                  type: string
                  enum: [terraria-tmodloader, dont-starve-together]
                  default: terraria-tmodloader
                workshopIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
      responses:
        "200":
          description: Current Steam metadata and library import status for each requested item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopPreview"
        "400":
          description: Invalid, unavailable, oversized, or unsupported Workshop item request
        "502":
          description: Steam Workshop API request failed
  /api/mods/workshop:
    post:
      summary: Idempotently import Workshop IDs as global mod library records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workshopIds]
              properties:
                workshopIds:
                  type: array
                  items:
                    type: string
                previewId:
                  type: string
                  description: Optional short-lived preview ID used to apply server-resolved Steam metadata.
      responses:
        "200":
          description: Imported Workshop mod records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModFile"
  /api/mods/{id}/assign:
    post:
      summary: Copy a global mod library item to a tModLoader server
      description: Customers need target workspace write permission. Instance-owned sources require source membership and the same workspace; legacy library ownership is not yet tenant-scoped.
      responses:
        "200":
          description: Updated existing assigned mod file record
        "201":
          description: Assigned mod
        "409":
          description: A game update is active for the target server
  /api/mods/{id}:
    delete:
      summary: Delete an unassigned global mod library item
      responses:
        "200":
          description: Deleted global mod
  /api/mod-packs:
    get:
      summary: List reusable tModLoader mod packs
      responses:
        "200":
          description: Mod pack list
    post:
      summary: Create a reusable tModLoader mod pack from global mod library items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, modIds]
              properties:
                name:
                  type: string
                description:
                  type: string
                modIds:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Created mod pack
  /api/mod-packs/{id}:
    delete:
      summary: Delete a reusable tModLoader mod pack
      responses:
        "200":
          description: Deleted mod pack
  /api/worlds:
    get:
      summary: List worlds
      description: Customer results use persistent workspace ownership. Unowned legacy worlds are platform-only; missing files are omitted without deleting metadata.
      responses:
        "200":
          description: World list
  /api/worlds/import:
    post:
      summary: Import .wld world file
      description: Attached imports require target workspace write permission. Unassigned imports use a private workspace directory; organizationId is optional only when the customer belongs to exactly one workspace.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                instanceId:
                  type: string
                organizationId:
                  type: string
      responses:
        "200":
          description: Updated existing world file record
        "201":
          description: Imported world
  /api/worlds/{id}/assign:
    post:
      summary: Assign world to server
      description: Customers need write membership for both the source and target, which must belong to the same workspace.
      responses:
        "200":
          description: Assigned world
        "409":
          description: A game update is active for the target server
  /api/worlds/{id}/download:
    get:
      summary: Download world file
      responses:
        "200":
          description: World file
  /api/worlds/{id}:
    delete:
      summary: Delete world file
      responses:
        "200":
          description: Deleted world
  /api/backups:
    get:
      summary: List backups
      description: Customers see backups only through current instance workspace membership. Missing files are omitted without deleting metadata.
      responses:
        "200":
          description: Backup list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
  /api/servers/{id}/backups:
    post:
      summary: Create manual backup
      responses:
        "201":
          description: Created backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "409":
          description: A game update is active for this server
  /api/backups/{id}/restore:
    post:
      summary: Restore backup
      description: Customer access requires current instance workspace membership; mutations require workspace write permission. Missing or inaccessible backups return 404.
      responses:
        "200":
          description: Restored backup
        "409":
          description: A game update is active for the backup's server
  /api/backups/{id}/download:
    get:
      summary: Download backup archive
      description: Customer access requires current instance workspace membership; mutations require workspace write permission. Missing or inaccessible backups return 404.
      responses:
        "200":
          description: Backup archive
  /api/backups/{id}:
    delete:
      summary: Delete backup
      description: Customer access requires current instance workspace membership; mutations require workspace write permission. Missing or inaccessible backups return 404.
      responses:
        "200":
          description: Deleted backup
  /api/terraria/presets:
    get:
      summary: List Terraria server presets
      responses:
        "200":
          description: Presets
  /api/terraria/versions:
    get:
      summary: List supported provider versions
      responses:
        "200":
          description: Version lists keyed by provider
  /api/terraria/config/preview:
    post:
      summary: Render serverconfig.txt preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                configVersion:
                  type: integer
                  minimum: 0
                  description: Configuration format version; omitted or zero means legacy format 1.
                config:
                  $ref: "#/components/schemas/TerrariaConfig"
      responses:
        "200":
          description: Rendered config
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverconfig:
                    type: string
        "400":
          description: Invalid config
components:
  securitySchemes:
    nodeToken:
      type: apiKey
      in: header
      name: X-Node-Token
    sessionCookie:
      type: apiKey
      in: cookie
      name: gamepanel_session
  schemas:
    RegionDirectoryEntry:
      type: object
      required: [id, name, acceptingCreates, version]
      properties:
        id: {type: string}
        name: {type: string}
        acceptingCreates: {type: boolean}
        version: {type: integer, format: int64, minimum: 1}
    AccountPreferences:
      type: object
      required: [locale, theme]
      properties:
        locale:
          type: string
          enum: [zh, en]
        theme:
          type: string
          enum: [light, dark, system]
    ConfigPresetInput:
      type: object
      required: [name, providerKey]
      properties:
        organizationId:
          type: string
          description: Creation may omit this for customers with exactly one workspace. Updates preserve existing ownership and reject another workspace. Legacy unowned presets remain administrator-only.
        name: {type: string}
        providerKey: {type: string}
        version: {type: string}
        config: {type: object}
        resources:
          type: object
          properties:
            cpuLimitCores: {type: number}
            memoryLimitMb: {type: integer}
        modPackId:
          type: string
          description: Customer references are unavailable until the mod library supports workspace ownership.
        modIds:
          type: array
          items: {type: string}
          description: Customers must omit this or send an empty list until the mod library supports workspace ownership.
    ConfigPreset:
      type: object
      required: [id, name, gameKey, providerKey, modIds, createdAt, updatedAt]
      properties:
        id: {type: string}
        organizationId: {type: string}
        name: {type: string}
        gameKey: {type: string}
        providerKey: {type: string}
        version: {type: string}
        config: {type: object}
        configPayload: {type: object}
        cpuLimitCores: {type: number}
        memoryLimitMb: {type: integer}
        modPackId: {type: string}
        modIds:
          type: array
          items: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PersonalOrganization:
      type: object
      required: [id, name, slug, plan, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationMembershipSummary:
      allOf:
        - $ref: "#/components/schemas/PersonalOrganization"
        - type: object
          required: [membershipRole]
          properties:
            membershipRole:
              type: string
              enum: [owner, admin, member, viewer]
    Backup:
      type: object
      required: [id, instanceId, fileName, worldName, sizeBytes, type, createdAt]
      properties:
        id:
          type: string
        instanceId:
          type: string
        gameKey:
          type: string
        providerKey:
          type: string
          description: Recorded source provider; historical records may omit this value.
        configVersion:
          type: integer
          minimum: 0
          description: Recorded source configuration format. Missing or zero denotes legacy format 1.
        fileName:
          type: string
        worldName:
          type: string
        sizeBytes:
          type: integer
        type:
          type: string
        createdAt:
          type: string
          format: date-time
    PanelBuildInfo:
      type: object
      required: [name, version, commit, buildTime, goVersion]
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        buildTime:
          type: string
        goVersion:
          type: string
    SystemUpdateManifest:
      type: object
      required: [schemaVersion, channel, version]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        channel:
          type: string
        version:
          type: string
        publishedAt:
          type: string
          format: date-time
        releaseNotesUrl:
          type: string
          format: uri
    SystemUpdateJob:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [running, completed, failed]
        stage:
          type: string
        message:
          type: string
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SystemUpdateStatus:
      type: object
      required: [current, updateAvailable, autoCheckEnabled, intervalHours, updaterAvailable]
      properties:
        current:
          $ref: "#/components/schemas/PanelBuildInfo"
        latest:
          $ref: "#/components/schemas/SystemUpdateManifest"
        updateAvailable:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        checkError:
          type: string
        autoCheckEnabled:
          type: boolean
        intervalHours:
          type: integer
          minimum: 1
        updaterAvailable:
          type: boolean
        job:
          $ref: "#/components/schemas/SystemUpdateJob"
    DeploymentService:
      type: object
      required: [name, state]
      properties:
        name:
          type: string
        state:
          type: string
        health:
          type: string
        image:
          type: string
    DeploymentHTTPSStatus:
      type: object
      required: [configured, certificate, autoRenewal]
      properties:
        configured:
          type: boolean
        domain:
          type: string
        certificate:
          type: string
          enum: [valid, expired, missing]
        expiresAt:
          type: string
          format: date-time
        daysRemaining:
          type: integer
        autoRenewal:
          $ref: "#/components/schemas/HTTPSAutoRenewalStatus"
    HTTPSAutoRenewalStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        method:
          type: string
        installedAt:
          type: string
          format: date-time
        lastCheckedAt:
          type: string
          format: date-time
        lastStatus:
          type: string
          enum: [pending, running, success, failed, unknown]
    DeploymentStatus:
      type: object
      required: [mode, manager, checkedAt, capabilities, healthy, services, https]
      properties:
        mode:
          type: string
          enum: [http, https]
        manager:
          type: string
          enum: [docker-compose, standalone]
        checkedAt:
          type: string
          format: date-time
        capabilities:
          $ref: "#/components/schemas/DeploymentCapabilities"
        healthy:
          type: boolean
        services:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentService"
        https:
          $ref: "#/components/schemas/DeploymentHTTPSStatus"
        job:
          $ref: "#/components/schemas/SystemUpdateJob"
    DeploymentCapabilities:
      type: object
      required: [reconcile, restart, httpsSetup, httpsRenew]
      properties:
        reconcile:
          type: boolean
        restart:
          type: boolean
        httpsSetup:
          type: boolean
        httpsRenew:
          type: boolean
    DockerStatus:
      type: object
      required: [available, message, host, lastCheckedAt]
      properties:
        available:
          type: boolean
        message:
          type: string
        host:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
    RuntimeImageStatus:
      type: object
      required: [image, status]
      properties:
        image:
          type: string
        status:
          type: string
          enum: [ready, missing, preparing, failed, unsupported]
        message:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        updatedAt:
          type: string
          format: date-time
    AppSettings:
      type: object
      required: [host, port, dataDir, dbPath, dockerHost, publicHost, locale]
      properties:
        host:
          type: string
        port:
          type: string
        dataDir:
          type: string
        dbPath:
          type: string
        dockerHost:
          type: string
        publicHost:
          type: string
        locale:
          type: string
          enum: [zh, en]
    ActivityEvent:
      type: object
      required: [id, type, message, createdAt]
      properties:
        organizationId:
          type: string
          description: Persisted workspace ownership; absent for platform or unowned legacy events.
        id:
          type: string
        instanceId:
          type: string
        type:
          type: string
        message:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CreateServerRequest:
      type: object
      required: [providerKey, config]
      properties:
        organizationId:
          type: string
          description: Resource workspace. Customer creation validates current write membership; legacy platform resources may omit it.
        name:
          type: string
        providerKey:
          $ref: "#/components/schemas/ProviderKey"
        config:
          type: object
          description: Provider-specific game configuration. Terraria providers use TerrariaConfig.
          oneOf:
            - $ref: "#/components/schemas/TerrariaConfig"
        hostPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: External host port. Zero or omitted means auto assign.
        version:
          type: string
        resources:
          $ref: "#/components/schemas/ResourceLimits"
    UpdateServerConfigRequest:
      type: object
      required: [config]
      properties:
        config:
          type: object
          description: Provider-specific game configuration. Terraria providers use TerrariaConfig.
          oneOf:
            - $ref: "#/components/schemas/TerrariaConfig"
        hostPort:
          type: integer
          minimum: 0
          maximum: 65535
          description: External host port. Zero means auto assign.
        resources:
          $ref: "#/components/schemas/ResourceLimits"
    ProviderKey:
      type: string
      enum: [terraria-vanilla, terraria-tmodloader, minecraft-java, palworld, dst]
    GameKey:
      type: string
      enum: [terraria, minecraft, palworld, dst]
    ServerDesiredState:
      type: string
      enum: [running, stopped, deleted]
    ServerPhase:
      type: string
      enum: [pending, reconciling, running, stopped, failed, deleting, deleted]
    ServerActualState:
      type: string
      enum: [running, stopped, missing, unknown]
    GameServer:
      type: object
      required: [id, name, gameKey, providerKey, spec, status, createdAt, updatedAt]
      properties:
        organizationId:
          type: string
          description: Resource workspace. Customer creation validates current write membership; legacy platform resources may omit it.
        id:
          type: string
        name:
          type: string
        gameKey:
          $ref: "#/components/schemas/GameKey"
        providerKey:
          $ref: "#/components/schemas/ProviderKey"
        spec:
          $ref: "#/components/schemas/ServerSpec"
        status:
          $ref: "#/components/schemas/ServerRuntimeStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GameUpdateJob:
      type: object
      required: [id, instanceId, providerKey, operation, status, stage, progress, startAfterUpdate, wasRunning, createdAt, updatedAt]
      properties:
        id:
          type: string
        instanceId:
          type: string
        providerKey:
          $ref: "#/components/schemas/ProviderKey"
        operation:
          type: string
          enum: [check, apply]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        stage:
          type: string
          enum: [queued, preflight, backing_up, stopping, refreshing_metadata, validating, downloading, installing, starting, health_check, completed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        installedBuildId:
          type: string
        latestBuildId:
          type: string
        startAfterUpdate:
          type: boolean
        wasRunning:
          type: boolean
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    GameUpdateState:
      type: object
      required: [supported, status]
      properties:
        supported:
          type: boolean
        status:
          type: string
          enum: [unknown, checking, up_to_date, available, updating, failed]
        installedBuildId:
          type: string
        latestBuildId:
          type: string
        checkedAt:
          type: string
          format: date-time
        job:
          $ref: "#/components/schemas/GameUpdateJob"
    WorldRegenerationJob:
      type: object
      required: [id, instanceId, providerKey, status, stage, progress, startAfter, wasRunning, createdAt, updatedAt]
      properties:
        id:
          type: string
        instanceId:
          type: string
        providerKey:
          $ref: "#/components/schemas/ProviderKey"
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        stage:
          type: string
          enum: [queued, stopping, backing_up, resetting, starting, health_check, rolling_back, completed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        backupId:
          type: string
        startAfter:
          type: boolean
        wasRunning:
          type: boolean
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    WorldRegenerationState:
      type: object
      required: [supported]
      properties:
        supported:
          type: boolean
        job:
          $ref: "#/components/schemas/WorldRegenerationJob"
    ServerSpec:
      type: object
      required: [generation, desiredState]
      properties:
        configVersion:
          type: integer
          minimum: 0
          description: Provider configuration format version. Missing or zero identifies legacy format 1, not the latest version.
        generation:
          type: integer
          minimum: 1
        desiredState:
          $ref: "#/components/schemas/ServerDesiredState"
        version:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Provider-specific structured configuration payload.
        sourceWorldId:
          type: string
        sourceWorldName:
          type: string
        resources:
          $ref: "#/components/schemas/ResourceLimits"
        network:
          $ref: "#/components/schemas/ServerNetworkSpec"
        runtime:
          $ref: "#/components/schemas/ServerRuntimeSpec"
    ServerNetworkSpec:
      type: object
      properties:
        port:
          type: integer
          minimum: 0
          maximum: 65535
        hostPort:
          type: integer
          minimum: 0
          maximum: 65535
        protocol:
          type: string
          enum: [tcp, udp]
    ServerRuntimeSpec:
      type: object
      properties:
        dataDir:
          type: string
        image:
          type: string
        env:
          type: array
          items:
            type: string
        cmd:
          type: array
          items:
            type: string
    ServerRuntimeStatus:
      type: object
      required: [phase, actualState, observedGeneration, appliedGeneration]
      properties:
        phase:
          $ref: "#/components/schemas/ServerPhase"
        actualState:
          $ref: "#/components/schemas/ServerActualState"
        runtimeId:
          type: string
        playersOnline:
          type: integer
          minimum: 0
        observedGeneration:
          type: integer
          minimum: 0
        appliedGeneration:
          type: integer
          minimum: 0
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/ServerCondition"
        lastError:
          type: string
        lastReconcileAt:
          type: string
          format: date-time
        lastTransitionAt:
          type: string
          format: date-time
    ServerCondition:
      type: object
      required: [type, status, lastTransitionAt]
      properties:
        type:
          type: string
          examples: [RuntimeReady, ConfigApplied, WorkloadStarted, WorkloadStopped, DeleteComplete]
        status:
          type: string
          enum: ["True", "False", Unknown]
        reason:
          type: string
        message:
          type: string
        observedGeneration:
          type: integer
          minimum: 0
        lastTransitionAt:
          type: string
          format: date-time
    ServerStats:
      type: object
      required: [cpuPercent, memoryMb, memoryLimitMb]
      properties:
        cpuPercent:
          type: number
        memoryMb:
          type: number
        memoryLimitMb:
          type: number
    MonitoringDataSource:
      type: object
      required: [kind, connected, endpointConfigured]
      properties:
        kind:
          type: string
          enum: [prometheus]
        connected:
          type: boolean
        endpointConfigured:
          type: boolean
        lastQueryAt:
          type: string
          format: date-time
        error:
          type: string
    MonitoringPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp:
          type: string
          format: date-time
        value:
          type: number
    MonitoringSeries:
      type: object
      required: [key, title, unit, chartType, points]
      properties:
        key:
          type: string
        title:
          type: string
        unit:
          type: string
        chartType:
          type: string
          enum: [line, area, bar]
        currentValue:
          type: number
        avg:
          type: number
        max:
          type: number
        threshold:
          type: number
        emptyReason:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringPoint"
    MonitoringMetrics:
      type: object
      required: [collectedAt, dataSource, series]
      properties:
        collectedAt:
          type: string
          format: date-time
        dataSource:
          $ref: "#/components/schemas/MonitoringDataSource"
        series:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MonitoringSeries"
    MonitoringOverview:
      type: object
      required: [collectedAt, dataSource, health, kpis]
      properties:
        collectedAt:
          type: string
          format: date-time
        dataSource:
          $ref: "#/components/schemas/MonitoringDataSource"
        health:
          type: object
        kpis:
          type: object
          properties:
            totalServers:
              type: integer
            runningServers:
              type: integer
            issues:
              type: integer
            onlinePlayers:
              type: integer
            playerCapacity:
              type: integer
            resourceUsagePercent:
              type: integer
            storageBytes:
              type: integer
    ServerLoadResponse:
      type: object
      required: [collectedAt, dataSource, rows]
      properties:
        collectedAt:
          type: string
          format: date-time
        dataSource:
          $ref: "#/components/schemas/MonitoringDataSource"
        rows:
          type: array
          items:
            type: object
    MonitoringEvents:
      type: object
      required: [collectedAt, events]
      properties:
        collectedAt:
          type: string
          format: date-time
        events:
          type: array
          items:
            type: object
    PlatformMonitoring:
      type: object
      required: [collectedAt, dataSource, services, series, topRoutes]
      properties:
        collectedAt:
          type: string
          format: date-time
        dataSource:
          $ref: "#/components/schemas/MonitoringDataSource"
        services:
          type: array
          items:
            type: object
        series:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MonitoringSeries"
        topRoutes:
          type: array
          items:
            type: object
            required: [route, method, requestCount, requestRate, errorRate, p95Ms]
            properties:
              route:
                type: string
              method:
                type: string
              requestCount:
                type: number
              requestRate:
                type: number
              errorRate:
                type: number
              p95Ms:
                type: number
    ResourceLimits:
      type: object
      description: Maximum resources for one game server container. Workspace instances require positive CPU and memory limits. Zero means unlimited only for self-hosted instances without a workspace.
      properties:
        cpuLimitCores:
          type: number
          minimum: 0
          maximum: 64
          description: Maximum CPU cores. Zero means Docker default/unlimited only without a workspace.
        memoryLimitMb:
          type: integer
          minimum: 0
          maximum: 262144
          description: Maximum memory in MB. Zero means Docker default/unlimited only without a workspace.
    LogSnapshot:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          items:
            type: string
    WorkshopPreview:
      type: object
      required: [previewId, collectionId, providerKey, expiresAt, items, summary]
      properties:
        previewId:
          type: string
        collectionId:
          type: string
          description: Empty for an individual-item preview.
        collectionName:
          type: string
        providerKey:
          type: string
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            required: [workshopId, title, fileSize, status, selectable]
            properties:
              workshopId:
                type: string
              title:
                type: string
              creatorSteamId:
                type: string
              previewUrl:
                type: string
                format: uri
              description:
                type: string
              fileSize:
                type: integer
                format: int64
              subscriptions:
                type: integer
              favorited:
                type: integer
              views:
                type: integer
              timeCreated:
                type: integer
                format: int64
              timeUpdated:
                type: integer
                format: int64
              tags:
                type: array
                items:
                  type: string
              status:
                type: string
                enum: [new, in_library, in_server, unavailable]
              selectable:
                type: boolean
        summary:
          type: object
          required: [total, new, inLibrary, inServer, unavailable]
          properties:
            total:
              type: integer
            new:
              type: integer
            inLibrary:
              type: integer
            inServer:
              type: integer
            unavailable:
              type: integer
    ModFile:
      type: object
      required: [id, instanceId, fileName, sizeBytes, enabled, createdAt]
      properties:
        organizationId:
          type: string
          description: Workspace owner of a library resource; absent on legacy records.
        providerKey:
          type: string
        gameKey:
          type: string
        contentHash:
          type: string
          description: SHA-256 of uploaded bytes when available.
        id:
          type: string
        instanceId:
          type: string
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
        enabled:
          type: boolean
        source:
          type: string
          enum: [upload, workshop]
          description: Upload means a file accepted by the Provider upload capability; workshop means an independent Steam Workshop item.
        workshopId:
          type: string
          description: Steam Workshop item ID when source is workshop.
        createdAt:
          type: string
          format: date-time
    ModConfigFile:
      type: object
      required: [name, sizeBytes, updatedAt]
      properties:
        name:
          type: string
          pattern: '^[^/\\]+\.json$'
        sizeBytes:
          type: integer
          format: int64
          maximum: 1048576
        updatedAt:
          type: string
          format: date-time
        content:
          type: string
          description: Present only when reading or mutating one file.
    TerrariaConfig:
      type: object
      required: [worldName, worldSize, worldEvil, difficulty, maxPlayers, port, secure, autoCreateWorld]
      properties:
        serverName:
          type: string
        worldName:
          type: string
        worldSize:
          type: string
          enum: [small, medium, large]
        worldEvil:
          type: string
          enum: [random, corruption, crimson]
        difficulty:
          type: string
          enum: [journey, classic, expert, master]
        maxPlayers:
          type: integer
          minimum: 1
          maximum: 255
        port:
          type: integer
          minimum: 1024
          maximum: 65535
        password:
          type: string
        motd:
          type: string
        seed:
          type: string
        specialSeeds:
          type: array
          description: Terraria 1.4.5+ Special world seed mode codes selected during world creation.
          items:
            type: string
        secretSeeds:
          type: array
          description: Terraria 1.4.5+ Secret world seed mode codes selected during world creation.
          items:
            type: string
        secure:
          type: boolean
        language:
          type: string
          default: en-US
          description: Fixed to en-US by the backend in V1 so console commands stay consistent with Terraria/tModLoader originals.
        autoCreateWorld:
          type: boolean
